<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Boop the Bear 🐻</title>
<style>
  /* ---------- RESET / BASE ---------- */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif;
    touch-action: manipulation;
  }

  /* ---------- SKY / SCENE ---------- */
  .scene {
    position: relative;
    width: 100%; height: 100%;
    background: linear-gradient(180deg, #AEE1F9 0%, #CDEFF6 55%, #E8F8F0 55%, #E8F8F0 100%);
    overflow: hidden;
  }

  /* Sun */
  .sun {
    position: absolute; top: 6%; right: 10%;
    width: 90px; height: 90px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #FFF3B0, #FFD34E 70%, #FFC107 100%);
    box-shadow: 0 0 40px 10px rgba(255, 210, 80, 0.55);
  }

  /* Clouds (static, made of overlapping circles) */
  .cloud { position: absolute; opacity: 0.95; }
  .cloud div {
    position: absolute; background: #ffffff; border-radius: 50%;
    box-shadow: 0 4px 6px rgba(0,0,0,0.04);
  }
  .cloud1 { top: 10%; left: 8%; width: 120px; height: 50px; }
  .cloud1 .a { width: 70px; height: 40px; left: 0; top: 10px; }
  .cloud1 .b { width: 55px; height: 45px; left: 35px; top: 0; }
  .cloud1 .c { width: 50px; height: 35px; left: 70px; top: 12px; }

  .cloud2 { top: 20%; right: 22%; width: 100px; height: 45px; }
  .cloud2 .a { width: 60px; height: 35px; left: 0; top: 10px; }
  .cloud2 .b { width: 45px; height: 38px; left: 30px; top: 0; }
  .cloud2 .c { width: 40px; height: 30px; left: 58px; top: 12px; }

  .cloud3 { top: 6%; left: 42%; width: 90px; height: 40px; }
  .cloud3 .a { width: 50px; height: 30px; left: 0; top: 8px; }
  .cloud3 .b { width: 40px; height: 32px; left: 25px; top: 0; }
  .cloud3 .c { width: 35px; height: 26px; left: 50px; top: 10px; }

  /* Birds (static little "M" shapes) */
  .bird { position: absolute; width: 26px; height: 12px; }
  .bird::before, .bird::after {
    content: ""; position: absolute; top: 0; width: 14px; height: 14px;
    border: 2px solid #5b6b73; border-bottom: none; border-right: none;
    border-radius: 50% 50% 0 0;
  }
  .bird::before { left: 0; transform: rotate(-45deg); }
  .bird::after  { left: 10px; transform: rotate(45deg) scaleX(-1); }
  .bird1 { top: 16%; left: 20%; }
  .bird2 { top: 12%; left: 28%; transform: scale(0.7); }
  .bird3 { top: 24%; right: 30%; transform: scale(0.8); }

  /* Field / grass */
  .field {
    position: absolute; bottom: 0; left: 0; width: 100%; height: 45%;
    background: linear-gradient(180deg, #8FCB57 0%, #6FAE3E 100%);
  }
  .field::before {
    content: ""; position: absolute; top: -3px; left: 0; width: 100%; height: 10px;
    background: repeating-linear-gradient(90deg, #7ec24a 0 12px, #75b843 12px 24px);
    clip-path: polygon(0 0, 100% 0, 100% 100%, 0% 40%);
  }

  /* ---------- CHARACTER ---------- */
  .stage {
    position: absolute; bottom: 6%; left: 50%; transform: translateX(-50%);
    width: 240px; height: 340px;
  }

  .character {
    position: relative; width: 100%; height: 100%;
    transform-origin: 50% 100%;
    cursor: pointer;
    animation: idle-bob 2.6s ease-in-out infinite;
  }

  @keyframes idle-bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  .character.hit {
    animation: hit-squash 0.45s ease;
  }

  @keyframes hit-squash {
    0%   { transform: scale(1, 1) rotate(0deg); }
    25%  { transform: scale(0.88, 1.14) rotate(-4deg); }
    55%  { transform: scale(1.1, 0.9) rotate(4deg); }
    80%  { transform: scale(0.96, 1.04) rotate(-1deg); }
    100% { transform: scale(1, 1) rotate(0deg); }
  }

  .part { position: absolute; transition: filter 0.15s ease; }
  .part:active { filter: brightness(0.9); }

  /* legs */
  .leg {
    width: 46px; height: 60px; background: #7a5230; border-radius: 20px;
    bottom: 0;
  }
  .leg.left  { left: 46px; }
  .leg.right { right: 46px; }

  /* torso */
  .torso {
    width: 170px; height: 160px; left: 50%; bottom: 46px;
    transform: translateX(-50%);
    background: radial-gradient(circle at 35% 30%, #C68A51, #A9703B 75%);
    border-radius: 70px 70px 55px 55px;
    box-shadow: inset 0 -14px 20px rgba(0,0,0,0.08);
  }
  .torso .belly {
    position: absolute; width: 90px; height: 100px; left: 50%; bottom: 14px;
    transform: translateX(-50%);
    background: #f1d3ab; border-radius: 50%;
  }

  /* arms */
  .arm { width: 44px; height: 100px; background: #A9703B; border-radius: 30px; bottom: 90px; }
  .arm.left  { left: 8px;  transform: rotate(18deg); transform-origin: top center; }
  .arm.right { right: 8px; transform: rotate(-18deg); transform-origin: top center; }

  /* head */
  .head {
    width: 150px; height: 150px; left: 50%; bottom: 196px;
    transform: translateX(-50%);
    background: #C68A51;
    border-radius: 50%;
    box-shadow: inset 0 -10px 16px rgba(0,0,0,0.08);
    overflow: hidden;
  }
  /* ears */
  .ear { width: 44px; height: 44px; background: #C68A51; border-radius: 50%; bottom: 236px; }
  .ear::after { content: ""; position: absolute; width: 20px; height: 20px; background: #f1d3ab; border-radius: 50%; top: 12px; left: 12px; }
  .ear.left  { left: 22px; }
  .ear.right { right: 22px; }

  /* face image / placeholder */
  .face {
    position: absolute; inset: 0; border-radius: 50%; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .face img { width: 100%; height: 100%; object-fit: cover; object-position: center 25%; display: block; }

  /* placeholder cute drawn face, shown until a real photo is added */
  .placeholder-face { position: relative; width: 100%; height: 100%; }
  .eye { position: absolute; width: 16px; height: 16px; background: #3a2b1f; border-radius: 50%; top: 58px; }
  .eye.left { left: 44px; } .eye.right { right: 44px; }
  .snout {
    position: absolute; width: 62px; height: 46px; left: 50%; bottom: 26px;
    transform: translateX(-50%); background: #f1d3ab; border-radius: 50%;
  }
  .nose { position: absolute; width: 18px; height: 12px; left: 50%; top: 6px; transform: translateX(-50%); background: #3a2b1f; border-radius: 50%; }

  /* ---------- SPEECH BUBBLE ---------- */
  .bubble {
    position: absolute; bottom: 108%; left: 50%; transform: translateX(-50%) scale(0.8);
    background: #fff; color: #444; padding: 10px 16px; border-radius: 18px;
    font-size: 15px; font-weight: 600; white-space: nowrap;
    box-shadow: 0 6px 16px rgba(0,0,0,0.15);
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .bubble::after {
    content: ""; position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%);
    border-width: 8px 8px 0 8px; border-style: solid; border-color: #fff transparent transparent transparent;
  }
  .bubble.show { opacity: 1; transform: translateX(-50%) scale(1); }

  /* ---------- HUD ---------- */
  .hud {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,0.85); padding: 8px 18px; border-radius: 20px;
    font-weight: 700; color: #6b4a2b; box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    font-size: 15px; text-align: center;
  }
  .hud small { display: block; font-weight: 500; color: #8a7860; font-size: 11px; }
</style>
</head>

<script>
  const character = document.getElementById('character');
  const bubble = document.getElementById('bubble');
  const hud = document.getElementById('hud');
  const parts = document.querySelectorAll('.part');

  const messages = [
    "Hehe, that tickles! 🥰",
    "I love you! 💕",
    "Ow ow, okay you win 😄",
    "Boop! Right back at you 😘",
    "Stoppp, you're so cute 🐻",
    "Best. Gift. Ever. 🎁",
    "Careful, I bruise adorably 😆",
    "Missed me, missed me! 🙈",
    "You + me = 🐻❤️",
    "Do that again 😍"
  ];

  let count = 0;
  let bubbleTimeout;

  function showBubble() {
    const msg = messages[Math.floor(Math.random() * messages.length)];
    bubble.textContent = msg;
    bubble.classList.add('show');
    clearTimeout(bubbleTimeout);
    bubbleTimeout = setTimeout(() => bubble.classList.remove('show'), 1300);
  }

  function registerHit() {
    count++;
    hud.firstChild.textContent = count;

    character.classList.remove('hit');
    // force reflow so the animation can restart even on rapid taps
    void character.offsetWidth;
    character.classList.add('hit');

    showBubble();
  }

  parts.forEach(part => {
    part.addEventListener('click', (e) => {
      e.stopPropagation();
      registerHit();
    });
  });

  character.addEventListener('animationend', (e) => {
    if (e.animationName === 'hit-squash') character.classList.remove('hit');
  });
</script>
